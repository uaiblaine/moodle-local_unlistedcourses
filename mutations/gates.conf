# Mutation spec for local_unlistedcourses.
#
# Each line breaks ONE guard and the sweep records which tests go red. A guard
# that reddens nothing is the finding: the suite would be green against code
# that no longer withholds what it claims to withhold.
#
# The gates whose named tests say "needs" a plugin are held only where that plugin is installed:
# m503 and m503b mount enrol_autoenrol and enrol_coursecompleted; no 5.3 stack mounts enrol_apply,
# whose supported range ends at 5.2. An mdl ci runner, and so --fast, installs none of them and
# skips those tests.
#
# tag | file relative to the repo | perl script relative to this directory
guest_guard           | classes/access.php | guest_guard.pl
strict_true           | classes/access.php | strict_true.pl
