# Mutation spec for local_unlistedcourses.
#
# Each line breaks ONE guard and the sweep records which tests go red. A guard
# that reddens nothing is the finding: the suite would be green against code
# that no longer withholds what it claims to withhold.
#
# The gates whose named tests say "needs" a plugin are held only where that plugin is installed:
# m502 and m502b mount enrol_apply, enrol_autoenrol and enrol_coursecompleted, while an mdl ci
# runner, and so --fast, installs none of them and skips those tests.
