# Mutation spec for local_unlistedcourses.
#
# Each line breaks ONE guard in classes/access.php and the sweep records which
# tests go red. A guard that reddens nothing is the finding: the suite would be
# green against code that no longer withholds what it claims to withhold.
#
# tag | file relative to the repo | perl script relative to this directory
guest_guard      | classes/access.php | guest_guard.pl
strict_true      | classes/access.php | strict_true.pl
unlisted_lookup  | classes/access.php | unlisted_lookup.pl
enrolled_short   | classes/access.php | enrolled_short.pl
siteid_early     | classes/access.php | siteid_early.pl
pending_term     | classes/access.php | pending_term.pl
staff_escape     | classes/access.php | staff_escape.pl
