# Mutation spec for local_unlistedcourses.
#
# Each line breaks ONE guard and the sweep records which tests go red. A guard
# that reddens nothing is the finding: the suite would be green against code
# that no longer withholds what it claims to withhold.
#
# tag | file relative to the repo | perl script relative to this directory
guest_guard           | classes/access.php | guest_guard.pl
strict_true           | classes/access.php | strict_true.pl
unlisted_lookup       | classes/access.php | unlisted_lookup.pl
enrolled_short        | classes/access.php | enrolled_short.pl
siteid_early          | classes/access.php | siteid_early.pl
pending_term          | classes/access.php | pending_term.pl
staff_escape          | classes/access.php | staff_escape.pl
publish_gate          | classes/discoverability.php | publish_gate.pl
public_needs_visible  | classes/discoverability.php | public_needs_visible.pl
public_needs_category | classes/discoverability.php | public_needs_category.pl
public_ignores_state  | classes/discoverability.php | public_ignores_state.pl
noop_transition       | classes/discoverability.php | noop_transition.pl
unknown_state         | classes/discoverability.php | unknown_state.pl
restore_unknown_state | backup/moodle2/restore_local_unlistedcourses_plugin.class.php | restore_unknown_state.pl
restore_refusal_caught | backup/moodle2/restore_local_unlistedcourses_plugin.class.php | restore_refusal_caught.pl
siteid_skip           | classes/local/legacy_field.php | siteid_skip.pl
form_public_option    | classes/local/courseform.php | form_public_option.pl
form_creator_guess    | classes/local/courseform.php | form_creator_guess.pl
form_freeze           | classes/local/courseform.php | form_freeze.pl
save_guard            | classes/local/courseform.php | save_guard.pl
