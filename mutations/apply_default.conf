ad_page_sesskey    | applydefault.php | ad_page_sesskey.pl
#   -> test_the_page_queues_only_after_its_guards
ad_page_post       | applydefault.php | ad_page_post.pl
#   -> test_the_page_queues_only_after_its_guards
ad_page_capability | settings.php | ad_page_capability.pl
#   -> test_only_a_site_administrator_may_reach_the_page
