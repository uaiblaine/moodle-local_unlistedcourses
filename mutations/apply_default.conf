# Applying the default for new courses to the courses that predate it (local_unlistedcourses/defaultstate,
# owner request of 2026-11-04). Each gate breaks one guard of the backfill, its task or its page, and must
# redden the tests named under it. Sweep on both database families:
#   mdl mutate <repo> "$PWD/mutations/apply_default.conf" --fast --db pgsql
#   mdl mutate <repo> "$PWD/mutations/apply_default.conf" --fast --db mariadb
# On the 5.3 branch add --branch MOODLE_503_STABLE; on the 5.2 one, --branch MOODLE_502_STABLE.
#
#     tag | file relative to the repo | perl script relative to this file

ad_no_row          | classes/local/default_backfill.php | ad_no_row.pl
#   -> test_only_older_courses_without_a_state_get_the_default
ad_siteid          | classes/local/default_backfill.php | ad_siteid.pl
#   -> test_the_site_course_is_never_given_the_default
ad_cutoff_strict   | classes/local/default_backfill.php | ad_cutoff_strict.pl
#   -> test_only_older_courses_without_a_state_get_the_default
ad_cutoff_value    | classes/local/default_backfill.php | ad_cutoff_value.pl
#   -> test_the_cutoff_is_when_the_current_default_was_recorded
ad_listed_nothing  | classes/local/default_backfill.php | ad_listed_nothing.pl
#   -> test_queue_needs_an_unlisted_default_and_queues_once
ad_queue_once      | classes/local/default_backfill.php | ad_queue_once.pl
#   -> test_queue_needs_an_unlisted_default_and_queues_once
ad_queue_cutoff    | classes/local/default_backfill.php | ad_queue_cutoff.pl
#   -> test_queue_refuses_a_cutoff_that_is_no_longer_current
ad_cutoff_future   | classes/local/default_backfill.php | ad_cutoff_future.pl
#   -> test_queue_refuses_a_cutoff_that_is_no_longer_current
ad_queue_capability | classes/local/default_backfill.php | ad_queue_capability.pl
#   -> test_queue_refuses_a_user_who_may_not_configure_the_site
ad_run_refuses     | classes/local/default_backfill.php | ad_run_refuses.pl
#   -> test_run_refuses_a_state_that_is_not_an_unlisted_default
ad_log_change      | classes/local/default_backfill.php | ad_log_change.pl
#   -> test_only_older_courses_without_a_state_get_the_default
#   -> test_every_course_is_written_across_chunk_boundaries
ad_reset_caches    | classes/local/default_backfill.php | ad_reset_caches.pl
#   -> test_only_older_courses_without_a_state_get_the_default
ad_replay          | classes/local/default_backfill.php | ad_replay.pl
#   -> test_a_row_written_meanwhile_is_kept_and_the_rest_of_the_chunk_written
ad_replay_check    | classes/local/default_backfill.php | ad_replay_check.pl
#   -> test_a_row_written_meanwhile_is_kept_and_the_rest_of_the_chunk_written
ad_task_recheck    | classes/task/apply_default_state.php | ad_task_recheck.pl
