# The report builder data sources (classes/reportbuilder). The effect column is SQL that mirrors
# discoverability::are_public() and category_discoverability::are_public(); each gate breaks one term
# of it, or one rule of what a report lists, and must redden the tests named under it. Sweep on both
# database families, because the path match is built from core's per-driver SQL helpers:
#   mdl mutate <repo> "$PWD/mutations/reportbuilder.conf" --fast --db pgsql
#   mdl mutate <repo> "$PWD/mutations/reportbuilder.conf" --fast --db mariadb
# On the 5.3 branch add --branch MOODLE_503_STABLE; on the 5.2 one, --branch MOODLE_502_STABLE.
#
#     tag | file relative to the repo | perl script relative to this file

